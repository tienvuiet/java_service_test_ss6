name: java-service-ss6

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: test_ss5
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    image: ${APP_IMAGE:-java-service-ss6:local}

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_ss5?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/api/students
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  mysql_data: