name: CI CD Spring Boot SS6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ss6-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: test_ss5
          MYSQL_ROOT_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/test_ss5?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci_test_password
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/java_service_test_ss6:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SSH_OPTIONS=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          IMAGE="$DOCKERHUB_USERNAME/java_service_test_ss6:$COMMIT_SHA"

          scp "${SSH_OPTIONS[@]}" -P "$VPS_PORT" \
            docker-compose.yml \
            "$VPS_USER@$VPS_HOST:apps/java_service_test_ss6/docker-compose.yml"

          ssh "${SSH_OPTIONS[@]}" -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$IMAGE" <<'REMOTE'
          set -euo pipefail

          cd "$HOME/apps/java_service_test_ss6"
          test -f .env

          export APP_IMAGE="$1"

          docker compose config --quiet
          docker compose pull backend

          docker compose up -d \
            --no-build \
            --wait \
            --wait-timeout 300 \
            backend

          curl --fail --silent --show-error \
            http://127.0.0.1:8081/api/students

          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env

          docker compose ps
          REMOTE